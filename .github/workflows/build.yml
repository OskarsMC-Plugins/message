name: Build message

on:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        java: [ "21" ]
        os: [ "ubuntu-latest" ]

    runs-on: ${{ matrix.os }}
    steps:
      - name: "checkout"
        uses: actions/checkout@v5

      - name: "setup java"
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: gradle

      - name: "validate gradle wrapper"
        uses: gradle/actions/wrapper-validation@v3

      - name: gradle build
        run: ./gradlew clean build

      # Upload Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: message
          path: build/libs
          retention-days: 60
  publish:
    strategy:
      matrix:
        java: [ "21" ]
        os: [ "ubuntu-latest" ]

    needs: build
    runs-on: ${{ matrix.os }}
    steps:
      - name: "checkout"
        uses: actions/checkout@v5

      - name: "setup java"
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: gradle

      - name: "validate gradle wrapper"
        uses: gradle/actions/wrapper-validation@v3

      - name: gradle publish
        run: ./gradlew build publish publishAllPublicationsToHangar
        env:
          MAVEN_USERNAME: ${{ SECRETS.MAVEN_USERNAME }}
          MAVEN_SECRET: ${{ SECRETS.MAVEN_SECRET }}
          HANGAR_API_KEY: ${{ SECRETS.HANGAR_API_KEY }}
